name: keepalive

# Pings the database every 3 days so the free Supabase project
# never hits the 7-day inactivity pause.
on:
  schedule:
    - cron: "0 6 */3 * *"   # 06:00 UTC, every 3 days
  workflow_dispatch:          # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/teacher_posts?select=post_id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
